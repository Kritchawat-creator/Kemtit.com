name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # src/lib/env.ts ข้าม validation เฉพาะเมื่อตั้งค่านี้ (ไม่ผูกกับ CI=true เพราะ Netlify ตั้ง CI=true ตอน build)
      SKIP_ENV_VALIDATION: "1"
      # ค่า placeholder สำหรับ build (POC Decisions M0 ข้อ 3)
      # ไม่ใส่ secret จริงใน CI ของ M0; Playwright ยังไม่รันจนกว่าจะมี flow จริง (ข้อ 7)
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v5

      # อ่านเวอร์ชัน pnpm จาก field "packageManager" ใน package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
